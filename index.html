<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Retro-Style Football – Coins & Packs</title>
  <style>
    body { margin: 0; background: #062b3d; color: white; font-family: sans-serif; }
    #gameCanvas { background: #0b5b2f; display: block; margin: 0 auto; }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="450"></canvas>
<script>
// ===== CORE SETUP =====
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ===== CONFIG =====
const CONFIG = {
  GAME_LENGTH_SECONDS: 90,
  BASE_DEFENDER_SPEED: 140,
  DIFFICULTY: 'NORMAL', // EASY, NORMAL, HARD
  WIN_COINS: 10,
  PACK_COST: 25,
};

const DIFFICULTY_SETTINGS = {
  EASY:   { defenderSpeedMult: 0.9, reactionDelay: 0.3, intChance: 0.03 },
  NORMAL: { defenderSpeedMult: 1.0, reactionDelay: 0.2, intChance: 0.07 },
  HARD:   { defenderSpeedMult: 1.2, reactionDelay: 0.1, intChance: 0.12 },
};

// ===== INPUT =====
const Keys = {};
window.addEventListener('keydown', e => Keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup',   e => Keys[e.key.toLowerCase()] = false);

// ===== BASE CLASSES =====
class GameObject {
  constructor(x, y, w, h, color = 'white') {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.vx = 0; this.vy = 0; this.color = color; this.dead = false;
  }
  update(dt) {}
  draw(ctx) {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.w, this.h);
  }
}

class Scene {
  constructor() { this.objects = []; }
  add(obj) { this.objects.push(obj); }
  update(dt) {
    for (const o of this.objects) o.update(dt);
    this.objects = this.objects.filter(o => !o.dead);
  }
  draw(ctx) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const o of this.objects) o.draw(ctx);
  }
}

const Game = {
  currentScene: null,
  lastTime: 0,
  start(scene) {
    this.currentScene = scene;
    this.lastTime = performance.now();
    const loop = (t) => {
      const dt = (t - this.lastTime) / 1000;
      this.lastTime = t;
      if (this.currentScene) {
        this.currentScene.update(dt);
        this.currentScene.draw(ctx);
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  },
  switchScene(scene) {
    this.currentScene = scene;
  }
};

// ===== GAME OBJECTS =====
class Player extends GameObject {
  constructor(x, y) {
    super(x, y, 20, 20, '#ffd700');
    this.speed = 200;
  }
  update(dt) {
    this.vx = 0; this.vy = 0;
    if (Keys['w'] || Keys['arrowup'])    this.vy = -this.speed;
    if (Keys['s'] || Keys['arrowdown'])  this.vy =  this.speed;
    if (Keys['a'] || Keys['arrowleft'])  this.vx = -this.speed;
    if (Keys['d'] || Keys['arrowright']) this.vx =  this.speed;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.x = Math.max(0, Math.min(canvas.width  - this.w, this.x));
    this.y = Math.max(0, Math.min(canvas.height - this.h, this.y));
  }
}

class Receiver extends GameObject {
  constructor(x, y) {
    super(x, y, 16, 16, '#88ccff');
    this.route = null;
    this.routeTime = 0;
  }
  setRoute(route) {
    this.route = route;
    this.routeTime = 0;
    this.x = route.startX;
    this.y = route.startY;
  }
  update(dt) {
    if (!this.route) return;
    this.routeTime += dt;
    let t = this.routeTime;
    let lastX = this.route.startX;
    let lastY = this.route.startY;
    for (const seg of this.route.segments) {
      if (t <= seg.dur) {
        const p = t / seg.dur;
        this.x = lastX + seg.dx * p;
        this.y = lastY + seg.dy * p;
        return;
      } else {
        lastX += seg.dx;
        lastY += seg.dy;
        t -= seg.dur;
      }
    }
    if (this.route.loop) {
      this.routeTime = 0;
      this.x = this.route.startX;
      this.y = this.route.startY;
    } else {
      this.x = lastX;
      this.y = lastY;
    }
  }
}

class Ball extends GameObject {
  constructor(x, y) {
    super(x, y, 8, 8, '#ffffff');
    this.friction = 0.98;
    this.inAir = false;
  }
  throwTo(tx, ty, power) {
    const dx = tx - (this.x + this.w / 2);
    const dy = ty - (this.y + this.h / 2);
    this.vx = dx * power;
    this.vy = dy * power;
    this.inAir = true;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vx *= this.friction;
    this.vy *= this.friction;
  }
}

class Defender extends GameObject {
  constructor(x, y) {
    super(x, y, 18, 18, '#ff4444');
    this.speed = CONFIG.BASE_DEFENDER_SPEED;
    this.reactionTimer = 0;
    this.target = null;
  }
  update(dt, target) {
    if (GameState.paused || GameState.inSummary) return;
    const diff = DIFFICULTY_SETTINGS[CONFIG.DIFFICULTY] || DIFFICULTY_SETTINGS.NORMAL;
    this.reactionTimer -= dt;
    if (this.reactionTimer <= 0) {
      this.target = target;
      this.reactionTimer = diff.reactionDelay;
    }
    if (!this.target) return;
    const tx = this.target.x + this.target.w / 2;
    const ty = this.target.y + this.target.h / 2;
    const cx = this.x + this.w / 2;
    const cy = this.y + this.h / 2;
    let dx = tx - cx;
    let dy = ty - cy;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const speed = this.speed * diff.defenderSpeedMult;
    this.vx = dx * speed;
    this.vy = dy * speed;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }
}

// ===== FIELD RENDERING =====
function drawField(ctx) {
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.strokeRect(40, 20, canvas.width - 80, canvas.height - 40);
  const left = 40, right = canvas.width - 40;
  const top = 20, bottom = canvas.height - 20;
  const segments = 10;
  const dx = (right - left) / segments;
  ctx.setLineDash([10, 10]);
  for (let i = 1; i < segments; i++) {
    const x = left + i * dx;
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x, bottom);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

// ===== ECONOMY & GAME STATE =====
const GameState = {
  homeScore: 0,
  awayScore: 0,
  timeLeft: CONFIG.GAME_LENGTH_SECONDS,
  message: '1-3 play, WASD, click to throw',
  paused: false,
  inSummary: false,
  selectedPlayIndex: 0,
  coins: 0,
  lastDraftedPlayer: null, // {name, stars}
  stats: {
    passAttempts: 0,
    completions: 0,
    interceptions: 0,
    passingYards: 0,
    touchdowns: 0,
    tackles: 0,
  }
};

function resetStats() {
  GameState.stats = {
    passAttempts: 0,
    completions: 0,
    interceptions: 0,
    passingYards: 0,
    touchdowns: 0,
    tackles: 0,
  };
}

function resetBallToPlayer(scene) {
  scene.ball.x = scene.player.x + scene.player.w / 2 - scene.ball.w / 2;
  scene.ball.y = scene.player.y + scene.player.h / 2 - scene.ball.h / 2;
  scene.ball.vx = 0;
  scene.ball.vy = 0;
  scene.ball.inAir = false;
}

function isTouchdown(ball) {
  const leftEndX = 40;
  const rightEndX = canvas.width - 40;
  const top = 20;
  const bottom = canvas.height - 20;
  const endZoneWidth = 40;
  const inVertical = ball.y + ball.h > top && ball.y < bottom;
  const inLeftEnd = ball.x < leftEndX + endZoneWidth && ball.x + ball.w > leftEndX;
  const inRightEnd = ball.x + ball.w > rightEndX - endZoneWidth && ball.x < rightEndX;
  if (!inVertical) return 0;
  if (inRightEnd) return 1;
  if (inLeftEnd) return -1;
  return 0;
}

function rectsOverlap(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

// ===== PLAYBOOK =====
const PLAYBOOK = [
  {
    name: 'Go Route',
    description: 'Single WR deep right',
    routes: [
      {
        startX: 150,
        startY: canvas.height / 2,
        loop: false,
        segments: [ { dx: 400, dy: 0, dur: 3.0 } ],
      },
    ],
  },
  {
    name: 'Slant Left',
    description: 'WR slant middle',
    routes: [
      {
        startX: 220,
        startY: canvas.height / 2 + 40,
        loop: false,
        segments: [
          { dx: 150, dy: -80, dur: 2.0 },
          { dx: 150, dy: -10, dur: 1.0 },
        ],
      },
    ],
  },
  {
    name: 'Crossers',
    description: 'Two WRs crossing',
    routes: [
      {
        startX: 210,
        startY: canvas.height / 2 - 40,
        loop: false,
        segments: [ { dx: 250, dy: 60, dur: 2.5 } ],
      },
      {
        startX: 210,
        startY: canvas.height / 2 + 40,
        loop: false,
        segments: [ { dx: 250, dy: -60, dur: 2.5 } ],
      },
    ],
  },
];

// ===== HUD & UI =====
function drawHUD(ctx) {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, canvas.width, 40);
  ctx.fillStyle = '#ffffff';
  ctx.font = '14px sans-serif';
  ctx.textBaseline = 'middle';
  const time = Math.ceil(GameState.timeLeft);
  ctx.fillText(`HOME ${GameState.homeScore} - ${GameState.awayScore} AWAY`, 20, 20);
  ctx.fillText(`TIME: ${time}s`, canvas.width / 2 - 40, 20);
  ctx.fillText(GameState.message, canvas.width - 340, 20);
}

function drawPlaybookBar(ctx) {
  const h = 40;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, canvas.height - h, canvas.width, h);
  ctx.font = '13px sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('Plays: (1-3) | Click WR | M: Menu', 10, canvas.height - h / 2);
  let offsetX = 260;
  for (let i = 0; i < PLAYBOOK.length; i++) {
    const play = PLAYBOOK[i];
    const isSel = (i === GameState.selectedPlayIndex);
    ctx.fillStyle = isSel ? '#33cc44' : '#cccccc';
    ctx.fillText(`${i + 1}) ${play.name}`, offsetX, canvas.height - h / 2);
    offsetX += 140;
  }
}

function drawSummaryOverlay(ctx) {
  if (!GameState.inSummary) return;
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ffffff';
  ctx.font = '24px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', canvas.width / 2, 80);
  ctx.font = '18px sans-serif';
  ctx.fillText(`Final Score: HOME ${GameState.homeScore} - ${GameState.awayScore} AWAY`, canvas.width / 2, 120);
  const s = GameState.stats;
  let y = 170;
  const lines = [
    `Pass Attempts: ${s.passAttempts}`,
    `Completions:   ${s.completions}`,
    `Interceptions: ${s.interceptions}`,
    `Passing Yards: ${s.passingYards}`,
    `TD Passes:     ${s.touchdowns}`,
    `Tackles Made:  ${s.tackles}`,
  ];
  ctx.font = '16px monospace';
  for (const line of lines) {
    ctx.fillText(line, canvas.width / 2, y);
    y += 26;
  }
  ctx.font = '16px sans-serif';
  ctx.fillText(`Coins: ${GameState.coins} (Win gives +${CONFIG.WIN_COINS})`, canvas.width / 2, y + 20);
  ctx.fillText('Press R to restart or M for Main Menu', canvas.width / 2, y + 50);
  ctx.textAlign = 'left';
}

// ===== PACK / DRAFT LOGIC =====
function rollStarRating() {
  // 1.0, 1.5, 2.0, ..., 5.0
  const steps = 8; // 0..8 -> 1.0 + 0.5*i
  const i = Math.floor(Math.random() * (steps + 1));
  return 1 + 0.5 * i;
}

function randomPlayerName() {
  const first = ['Max', 'Cole', 'Jett', 'Troy', 'Zane', 'Blake', 'Duke', 'Reid'];
  const last  = ['Harper', 'Knight', 'Brooks', 'Stone', 'Madden', 'Cruz', 'Foster', 'Fields'];
  const f = first[Math.floor(Math.random() * first.length)];
  const l = last[Math.floor(Math.random() * last.length)];
  return f + ' ' + l;
}

function openPackIfPossible() {
  if (GameState.coins < CONFIG.PACK_COST) {
    GameState.lastDraftedPlayer = { name: 'Not enough coins', stars: 0 };
    return;
  }
  GameState.coins -= CONFIG.PACK_COST;
  const stars = rollStarRating();
  const name = randomPlayerName();
  GameState.lastDraftedPlayer = { name, stars };
}

// ===== MAIN MENU SCENE =====
class MenuScene extends Scene {
  constructor() {
    super();
    this.blinkTimer = 0;
  }
  update(dt) {
    this.blinkTimer += dt;
  }
  draw(ctx) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#062b3d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = '32px sans-serif';
    ctx.fillText('RETRO-STYLE FOOTBALL', canvas.width / 2, 70);

    ctx.font = '18px sans-serif';
    ctx.fillText('WASD / Arrows to move, Click to throw to receivers', canvas.width / 2, 120);
    ctx.fillText('1-3: Choose play | D: Cycle difficulty', canvas.width / 2, 150);
    ctx.fillText('SPACE: pause in-game | R: restart game | M: main menu', canvas.width / 2, 180);

    ctx.font = '20px sans-serif';
    ctx.fillText(`Difficulty: ${CONFIG.DIFFICULTY}`, canvas.width / 2, 220);

    // Coins and packs
    ctx.font = '18px sans-serif';
    ctx.fillText(`Coins: ${GameState.coins}`, canvas.width / 2, 260);
    ctx.font = '16px sans-serif';
    ctx.fillText(`Press P to open a pack (${CONFIG.PACK_COST} coins)`, canvas.width / 2, 290);

    if (GameState.lastDraftedPlayer) {
      const lp = GameState.lastDraftedPlayer;
      ctx.font = '16px monospace';
      const label = lp.stars > 0
        ? `Last draft: ${lp.name} - ${lp.stars.toFixed(1)}★`
        : lp.name;
      ctx.fillText(label, canvas.width / 2, 320);
    }

    const showPress = Math.floor(this.blinkTimer * 2) % 2 === 0;
    if (showPress) {
      ctx.font = '20px sans-serif';
      ctx.fillText('Press ENTER to Start Game', canvas.width / 2, 370);
    }

    ctx.textAlign = 'left';
  }
}

// ===== FIELD SCENE =====
class FieldScene extends Scene {
  constructor() {
    super();
    this.player = new Player(100, canvas.height / 2);
    this.ball = new Ball(200, canvas.height / 2);
    this.receivers = [];
    this.defenders = [];
    this.add(this.player);
    this.add(this.ball);
    this.applyPlay(PLAYBOOK[GameState.selectedPlayIndex]);
    this.spawnDefenders();

    window.addEventListener('mousedown', (e) => {
      if (GameState.paused || GameState.inSummary || !(Game.currentScene instanceof FieldScene)) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      let best = null;
      let bestDist = Infinity;
      for (const r of this.receivers) {
        const cx = r.x + r.w / 2;
        const cy = r.y + r.h / 2;
        const d = Math.hypot(mx - cx, my - cy);
        if (d < bestDist) { bestDist = d; best = r; }
      }
      if (!best) return;
      const power = 2.5;
      this.ball.x = this.player.x + this.player.w / 2 - this.ball.w / 2;
      this.ball.y = this.player.y + this.player.h / 2 - this.ball.h / 2;
      this.ball.throwTo(best.x + best.w / 2, best.y + best.h / 2, power);
      GameState.stats.passAttempts++;
      GameState.message = 'Ball in the air...';
    });
  }

  applyPlay(play) {
    for (const r of this.receivers) r.dead = true;
    this.objects = this.objects.filter(o => !(o instanceof Receiver));
    this.receivers = [];
    for (const route of play.routes) {
      const r = new Receiver(route.startX, route.startY);
      r.setRoute(route);
      this.receivers.push(r);
      this.add(r);
    }
  }

  spawnDefenders() {
    this.defenders = [];
    const count = 3;
    for (let i = 0; i < count; i++) {
      const x = canvas.width / 2 + 100 + i * 30;
      const y = 100 + i * 60;
      const d = new Defender(x, y);
      this.defenders.push(d);
      this.add(d);
    }
  }

  resetDefenders() {
    this.objects = this.objects.filter(o => !(o instanceof Defender));
    this.spawnDefenders();
  }

  update(dt) {
    if (!GameState.paused && !GameState.inSummary) {
      GameState.timeLeft -= dt;
      if (GameState.timeLeft <= 0) {
        GameState.timeLeft = 0;
        GameState.paused = true;
        GameState.inSummary = true;
        GameState.message = 'Game Over';
        // coin reward on win
        if (GameState.homeScore > GameState.awayScore) {
          GameState.coins += CONFIG.WIN_COINS;
        }
      }
    }

    if (!GameState.paused && !GameState.inSummary) {
      this.player.update(dt);
      this.ball.update(dt);
      for (const r of this.receivers) r.update(dt);
      if (this.defenders) {
        const chaseTarget = this.ball.inAir ? this.ball : this.player;
        for (const d of this.defenders) d.update(dt, chaseTarget);
      }

      // tackle detection
      if (this.defenders) {
        for (const d of this.defenders) {
          if (rectsOverlap(d, this.player)) {
            GameState.stats.tackles++;
            GameState.message = 'Tackled! Play reset';
            resetBallToPlayer(this);
            this.resetDefenders();
            this.applyPlay(PLAYBOOK[GameState.selectedPlayIndex]);
            break;
          }
        }
      }

      // pass resolution
      if (this.ball.inAir) {
        let caught = false;
        for (const r of this.receivers) {
          if (rectsOverlap(this.ball, r)) {
            caught = true;
            GameState.stats.completions++;
            const yards = Math.max(0, Math.floor((this.ball.x - this.player.x) / 10));
            GameState.stats.passingYards += yards;
            GameState.message = 'Catch!';
            this.ball.inAir = false;
            this.ball.vx = 0;
            this.ball.vy = 0;
            break;
          }
        }
        if (!caught) {
          const diff = DIFFICULTY_SETTINGS[CONFIG.DIFFICULTY] || DIFFICULTY_SETTINGS.NORMAL;
          for (const d of this.defenders) {
            if (rectsOverlap(this.ball, d)) {
              if (Math.random() < diff.intChance) {
                GameState.stats.interceptions++;
                GameState.message = 'Intercepted! Play reset';
              } else {
                GameState.message = 'Defended pass!';
              }
              this.ball.inAir = false;
              this.ball.vx = 0;
              this.ball.vy = 0;
              resetBallToPlayer(this);
              this.resetDefenders();
              this.applyPlay(PLAYBOOK[GameState.selectedPlayIndex]);
              break;
            }
          }
        }
      }

      const td = isTouchdown(this.ball);
      if (td !== 0) {
        if (td > 0) {
          GameState.homeScore += 7;
          GameState.message = 'Touchdown Home!';
          GameState.stats.touchdowns++;
        } else {
          GameState.awayScore += 7;
          GameState.message = 'Touchdown Away!';
        }
        resetBallToPlayer(this);
        this.resetDefenders();
        this.applyPlay(PLAYBOOK[GameState.selectedPlayIndex]);
      }
    }
  }

  draw(ctx) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawField(ctx);
    ctx.fillStyle = '#0033aa';
    ctx.fillRect(40, 20, 40, canvas.height - 40);
    ctx.fillStyle = '#aa3300';
    ctx.fillRect(canvas.width - 80, 20, 40, canvas.height - 40);
    for (const o of this.objects) o.draw(ctx);
    drawHUD(ctx);
    drawPlaybookBar(ctx);
    drawSummaryOverlay(ctx);
  }
}

// ===== GAME RESET =====
function resetGame(scene) {
  GameState.homeScore = 0;
  GameState.awayScore = 0;
  GameState.timeLeft = CONFIG.GAME_LENGTH_SECONDS;
  GameState.message = 'New Game! 1-3 to pick play';
  GameState.paused = false;
  GameState.inSummary = false;
  resetStats();
  resetBallToPlayer(scene);
  scene.resetDefenders();
  scene.applyPlay(PLAYBOOK[GameState.selectedPlayIndex]);
}

// ===== GLOBAL KEYS =====
window.addEventListener('keydown', (e) => {
  const scene = Game.currentScene;

  // ENTER: start game from menu
  if (e.code === 'Enter') {
    if (scene instanceof MenuScene) {
      const field = new FieldScene();
      resetGame(field);
      Game.switchScene(field);
      return;
    }
  }

  // M: back to menu
  if (e.key && e.key.toLowerCase() === 'm') {
    Game.switchScene(new MenuScene());
    return;
  }

  // P: open pack from menu
  if (e.key && e.key.toLowerCase() === 'p') {
    if (scene instanceof MenuScene) {
      openPackIfPossible();
      return;
    }
  }

  if (scene instanceof FieldScene) {
    if (e.code === 'Space') {
      if (!GameState.inSummary) {
        GameState.paused = !GameState.paused;
        GameState.message = GameState.paused ? 'Paused' : 'Game resumed';
      }
    }
    if (e.code === 'KeyR') {
      resetGame(scene);
    }
    if (e.key === '1' || e.key === '2' || e.key === '3') {
      const idx = parseInt(e.key, 10) - 1;
      if (idx >= 0 && idx < PLAYBOOK.length) {
        GameState.selectedPlayIndex = idx;
        GameState.message = `Play: ${PLAYBOOK[idx].name}`;
        scene.applyPlay(PLAYBOOK[idx]);
      }
    }
  }

  // D: cycle difficulty (menu or game)
  if (e.key && e.key.toLowerCase() === 'd') {
    const order = ['EASY', 'NORMAL', 'HARD'];
    let i = order.indexOf(CONFIG.DIFFICULTY);
    if (i === -1) i = 1;
    i = (i + 1) % order.length;
    CONFIG.DIFFICULTY = order[i];
    GameState.message = `Difficulty: ${CONFIG.DIFFICULTY}`;
  }
});

// ===== START AT MAIN MENU =====
const startScene = new MenuScene();
Game.start(startScene);
</script>
</body>
</html>
