<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eaglercraft Modern Client</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .launcher-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 20px;
            color: #fff;
            background-color: #55a630;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .launcher-btn:hover {
            background-color: #2b9348;
        }
    </style>
</head>
<body>

    <button class="launcher-btn" id="playBtn">Play Eaglercraft 26.3</button>

    <script>
        // Points to the most up to date stable active web build instance
        const gameUrl = "https://eaglercraft.com/mc/a1.2.6/"; 
        
        document.getElementById('playBtn').onclick = function() {
            let win = window.open();
            win.document.body.style.margin = '0';
            win.document.body.style.height = '100vh';
            win.document.body.style.backgroundColor = '#000';
            
            let iframe = win.document.createElement('iframe');
            iframe.style.border = 'none';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.margin = '0';
            iframe.src = gameUrl;
            
            win.document.body.appendChild(iframe);
            window.close();
        };
    </script>
</body>
</html>
